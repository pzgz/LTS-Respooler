; PlatformIO build for the LTS Respooler driver board (ESP32-WROOM-32 devkit).
; Toolchain matches the official 1.3.0 binary: arduino-esp32 3.3.11 / ESP-IDF v5.5.5.
;
;   pio run                      build  -> .pio/build/driver-board/firmware.bin
;   pio run -t upload            flash bootloader + partitions + app over USB
;   pio device monitor           serial diagnostics (#BOOT / #HB lines)
;
; To keep the settings stored on the board (NVS), flash only the app:
;   esptool --chip esp32 -p <port> -b 460800 write-flash 0x10000 .pio/build/driver-board/firmware.bin

[platformio]
src_dir = .
default_envs = driver-board

[env:driver-board]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = esp32dev
framework = arduino
board_build.partitions = min_spiffs.csv
board_build.flash_mode = dio
board_build.f_flash = 80000000L
upload_speed = 460800
monitor_speed = 115200
monitor_filters = time
build_flags =
  -DCORE_DEBUG_LEVEL=0
lib_deps =
  teemuatlut/TMCStepper@^0.7.3
  h2zero/NimBLE-Arduino@^2.3.0
  bblanchon/ArduinoJson@^7.4.2
  adafruit/Adafruit NeoPixel@^1.15.1
